<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智慧行程助手">

  <link rel="manifest" href="./manifest.webmanifest">

  <title>智慧行程助手</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen pb-12 font-sans">

<header class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white py-6 px-4 shadow-lg sticky top-0 z-50">
  <div class="max-w-md mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="bg-white/20 p-2.5 rounded-xl">
        <i class="fa-solid fa-bell text-xl text-amber-300"></i>
      </div>

      <div>
        <h1 class="text-xl font-bold">智慧行程助手</h1>
        <p class="text-xs text-indigo-100">智慧倒推提前提醒</p>
      </div>
    </div>

    <button
      onclick="requestNotificationPermission()"
      class="text-xs bg-white/10 border border-white/30 px-3 py-1.5 rounded-full">
      🔔 啟用提醒
    </button>
  </div>
</header>

<main class="max-w-md mx-auto px-4 mt-6 space-y-5">

<section class="bg-white p-4 rounded-2xl shadow-sm border">
  <h2 class="text-xs font-bold text-slate-400 mb-3">
    ⚡ 快速範本
  </h2>

  <div class="grid grid-cols-3 gap-2">

    <button
      onclick="applyTemplate('👶 接送小孩',30)"
      class="p-3 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-semibold">
      👶<br>接送小孩
    </button>

    <button
      onclick="applyTemplate('👵 長輩看診',60)"
      class="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-semibold">
      👵<br>長輩看診
    </button>

    <button
      onclick="applyTemplate('🛒 採買用品',15)"
      class="p-3 bg-amber-50 text-amber-700 rounded-xl text-xs font-semibold">
      🛒<br>採買用品
    </button>

  </div>
</section>

<section class="bg-white p-5 rounded-2xl shadow-sm border">

  <h2 id="formTitle" class="text-base font-bold mb-4">
    ➕ 新增待辦行程
  </h2>

  <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-4">

    <input type="hidden" id="editTaskId">

    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1.5">
        行程名稱
      </label>

      <input
        id="taskTitle"
        type="text"
        required
        placeholder="例如：帶小孩上課"
        class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl">
    </div>

    <div class="grid grid-cols-1 gap-3">

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">
          預定時間
        </label>

        <input
          id="taskTime"
          type="datetime-local"
          required
          class="w-full max-w-full px-3 py-2.5 bg-slate-50 border rounded-xl">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">
          提前提醒
        </label>

        <select
          id="advanceMinutes"
          class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl">

          <option value="15">提前 15 分鐘</option>
          <option value="30">提前 30 分鐘</option>
          <option value="60">提前 1 小時</option>

        </select>
      </div>

    </div>

    <button
      id="submitBtn"
      type="submit"
      class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl">

      ➕ 加入行程
    </button>

  </form>

</section>

<section class="bg-white p-5 rounded-2xl shadow-sm border">

  <div class="flex justify-between items-center mb-3">

    <h2 class="text-base font-bold">
      📋 預定行程
    </h2>

    <span
      id="taskCount"
      class="text-xs bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1 rounded-full">
      0 項
    </span>

  </div>

  <div id="taskList" class="space-y-3"></div>

</section>

</main>

<script>

let tasks = JSON.parse(localStorage.getItem("helper_tasks") || "[]");

function saveTasks() {
  localStorage.setItem("helper_tasks", JSON.stringify(tasks));
}

function formatDateForInput(date) {

  const pad = n => String(n).padStart(2,"0");

  return date.getFullYear() + "-" +
    pad(date.getMonth()+1) + "-" +
    pad(date.getDate()) + "T" +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes());
}

function setDefaultTime() {

  const now = new Date();

  now.setMinutes(now.getMinutes() + 60);

  document.getElementById("taskTime").value =
    formatDateForInput(now);
}

function applyTemplate(title, advance) {

  document.getElementById("taskTitle").value = title;

  document.getElementById("advanceMinutes").value = advance;

  if (!document.getElementById("taskTime").value) {
    setDefaultTime();
  }
}

async function requestNotificationPermission() {

  if (!("Notification" in window)) {

    alert("你的裝置目前不支援瀏覽器通知。");

    return;
  }

  const permission =
    await Notification.requestPermission();

  if (permission === "granted") {

    alert("🔔 提醒功能已啟用！");

  } else {

    alert("請允許通知，才能收到提醒。");

  }
}

function handleFormSubmit(event) {

  event.preventDefault();

  const title =
    document.getElementById("taskTitle").value.trim();

  const time =
    document.getElementById("taskTime").value;

  const advance =
    Number(document.getElementById("advanceMinutes").value);

  const editId =
    document.getElementById("editTaskId").value;

  if (!title || !time) return;

  const targetTime =
    new Date(time).getTime();

  const remindTime =
    targetTime - advance * 60 * 1000;

  if (editId) {

    tasks = tasks.map(task => {

      if (task.id == editId) {

        return {
          ...task,
          title,
          targetTime,
          remindTime,
          advance,
          notified: false
        };

      }

      return task;

    });

  } else {

    tasks.push({

      id: Date.now(),

      title,

      targetTime,

      remindTime,

      advance,

      notified: false

    });

  }

  saveTasks();

  renderTasks();

  resetForm();

}

function resetForm() {

  document.getElementById("taskForm").reset();

  document.getElementById("editTaskId").value = "";

  document.getElementById("formTitle").innerText =
    "➕ 新增待辦行程";

  document.getElementById("submitBtn").innerText =
    "➕ 加入行程";

  setDefaultTime();

}

function editTask(id) {

  const task =
    tasks.find(t => t.id === id);

  if (!task) return;

  document.getElementById("editTaskId").value =
    task.id;

  document.getElementById("taskTitle").value =
    task.title;

  document.getElementById("taskTime").value =
    formatDateForInput(new Date(task.targetTime));

  document.getElementById("advanceMinutes").value =
    task.advance;

  document.getElementById("formTitle").innerText =
    "✏️ 編輯行程";

  document.getElementById("submitBtn").innerText =
    "💾 儲存修改";

}

function deleteTask(id) {

  tasks =
    tasks.filter(task => task.id !== id);

  saveTasks();

  renderTasks();

}

function renderTasks() {

  const list =
    document.getElementById("taskList");

  const count =
    document.getElementById("taskCount");

  count.innerText =
    tasks.length + " 項";

  list.innerHTML = "";

  if (tasks.length === 0) {

    list.innerHTML =
      '<div class="text-center py-8 text-slate-400 text-sm">目前沒有預定行程</div>';

    return;
  }

  tasks
    .sort((a,b) => a.targetTime - b.targetTime)
    .forEach(task => {

      const date =
        new Date(task.targetTime);

      const dateText =
        date.toLocaleString("zh-TW", {
          month:"numeric",
          day:"numeric",
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        });

      const item =
        document.createElement("div");

      item.className =
        "p-4 bg-slate-50 rounded-xl border flex items-center justify-between gap-3";

      item.innerHTML = `

        <div class="flex-1">

          <div class="font-bold text-sm mb-1">
            ${escapeHtml(task.title)}
          </div>

          <div class="text-xs text-slate-500">
            🕐 ${dateText}
           　
            ⏰ 提前 ${task.advance} 分鐘
          </div>

          <div class="text-xs mt-1 ${
            task.notified
              ? "text-slate-400"
              : "text-indigo-600"
          }">

            ${
              task.notified
                ? "✓ 已提醒"
                : "● 等待提醒"
            }

          </div>

        </div>

        <div class="flex gap-1">

          <button
            onclick="editTask(${task.id})"
            class="p-2 text-amber-600">
            ✏️
          </button>

          <button
            onclick="deleteTask(${task.id})"
            class="p-2 text-rose-600">
            🗑️
          </button>

        </div>
      `;

      list.appendChild(item);

    });

}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

function checkReminders() {

  const now = Date.now();

  let changed = false;

  tasks.forEach(task => {

    if (!task.notified &&
        now >= task.remindTime) {

      task.notified = true;

      changed = true;

      const message =
        `「${task.title}」將於 ${task.advance} 分鐘後開始！`;

      if (
        "Notification" in window &&
        Notification.permission === "granted"
      ) {

        new Notification("🔔 行程提醒", {
          body: message
        });

      } else {

        alert("🔔 " + message);

      }

    }

  });

  if (changed) {

    saveTasks();

    renderTasks();

  }

}

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(() => {});

  });

}

setDefaultTime();

renderTasks();

setInterval(checkReminders, 10000);
  // ==========================================
// ⭐ 新功能：行程即時倒數
// ==========================================

function formatCountdown(ms) {
    if (ms <= 0) {
        return "已到時間";
    }

    const totalSeconds = Math.floor(ms / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    if (days > 0) {
        return `還有 ${days} 天 ${hours} 小時`;
    }

    if (hours > 0) {
        return `還有 ${hours} 小時 ${minutes} 分`;
    }

    if (minutes > 0) {
        return `還有 ${minutes} 分 ${seconds} 秒`;
    }

    return `還有 ${seconds} 秒`;
}


// 更新所有倒數
function updateCountdowns() {
    const now = Date.now();

    document.querySelectorAll("[data-countdown-time]").forEach(element => {
        const targetTime = Number(element.dataset.countdownTime);

        if (!targetTime) return;

        const remaining = targetTime - now;

        element.textContent = formatCountdown(remaining);

        // 已經到時間
        if (remaining <= 0) {
            element.classList.remove(
                "text-blue-600",
                "text-indigo-600",
                "text-green-600"
            );

            element.classList.add("text-red-600");
        }
    });
}


// 在原本行程畫面加入倒數
function addCountdownToTasks() {
    if (typeof tasks === "undefined" || !Array.isArray(tasks)) {
        return;
    }

    const taskElements = document.querySelectorAll("[data-task-id]");

    taskElements.forEach(element => {
        const taskId = element.dataset.taskId;

        const task = tasks.find(t => String(t.id) === String(taskId));

        if (!task) return;

        let countdown = element.querySelector(".live-countdown");

        if (!countdown) {
            countdown = document.createElement("div");

            countdown.className =
                "live-countdown text-sm font-semibold text-indigo-600 mt-1";

            countdown.dataset.countdownTime =
                task.targetTime;

            element.appendChild(countdown);
        }
    });

    updateCountdowns();
}


// 每秒更新一次
setInterval(updateCountdowns, 1000);


// 頁面載入後更新
setTimeout(() => {
    addCountdownToTasks();
    updateCountdowns();
}, 500);


// 每次畫面重新產生行程後，再更新倒數
const originalRenderTasks = window.renderTasks;

if (typeof originalRenderTasks === "function") {

    window.renderTasks = function() {

        originalRenderTasks();

        setTimeout(() => {
            addCountdownToTasks();
            updateCountdowns();
        }, 50);

    };
}

// 初始化
updateCountdowns();


// ==========================================
// ⭐ 即時倒數功能結束
// ==========================================
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => {
      console.log("Service Worker 註冊成功");
    })
    .catch(error => {
      console.error("Service Worker 註冊失敗:", error);
    });
}
</script>

</body>
</html>
